<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1360" viewBox="0 0 2048 1360">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c7d2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="gridPattern" width="64" height="64" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="64" y2="0" stroke="url(#gridGradient)" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="64" stroke="url(#gridGradient)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dotPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#6366f1" opacity="0.15"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base background -->
  <rect width="2048" height="1360" fill="#f8fafc"/>
  <!-- Subtle gradient overlay -->
  <rect width="2048" height="1360" fill="url(#glowGradient)"/>
  <!-- Center radial glow -->
  <ellipse cx="1024" cy="680" rx="900" ry="500" fill="url(#centerGlow)"/>
  <!-- Grid pattern -->
  <rect width="2048" height="1360" fill="url(#gridPattern)" opacity="0.4"/>
  <!-- Dot pattern overlay -->
  <rect width="2048" height="1360" fill="url(#dotPattern)" opacity="0.3"/>
  <!-- Circuit lines -->
  <g stroke="#6366f1" stroke-width="0.8" opacity="0.08" fill="none">
    <path d="M200,200 L600,200 L600,400" filter="url(#glow)"/>
    <path d="M1448,200 L1848,200 L1848,400" filter="url(#glow)"/>
    <path d="M200,960 L600,960 L600,1160" filter="url(#glow)"/>
    <path d="M1448,960 L1848,960 L1848,1160" filter="url(#glow)"/>
    <path d="M400,100 L400,500" filter="url(#glow)"/>
    <path d="M1648,100 L1648,500" filter="url(#glow)"/>
    <path d="M400,860 L400,1260" filter="url(#glow)"/>
    <path d="M1648,860 L1648,1260" filter="url(#glow)"/>
  </g>
  <!-- Corner brackets -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.15" fill="none">
    <path d="M80,80 L200,80 M80,80 L80,200"/>
    <path d="M1968,80 L1848,80 M1968,80 L1968,200"/>
    <path d="M80,1280 L200,1280 M80,1280 L80,1160"/>
    <path d="M1968,1280 L1848,1280 M1968,1280 L1968,1160"/>
  </g>
  <!-- Floating nodes -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="300" cy="300" r="3"/>
    <circle cx="1748" cy="300" r="2"/>
    <circle cx="300" cy="1060" r="2"/>
    <circle cx="1748" cy="1060" r="3"/>
    <circle cx="800" cy="200" r="1.5"/>
    <circle cx="1248" cy="200" r="1.5"/>
    <circle cx="800" cy="1160" r="1.5"/>
    <circle cx="1248" cy="1160" r="1.5"/>
    <circle cx="1024" cy="680" r="4"/>
  </g>
  <!-- Data streams -->
  <g stroke="#818cf8" stroke-width="0.5" opacity="0.06" fill="none">
    <path d="M0,340 Q512,280 1024,340 T2048,460"/>
    <path d="M0,680 Q512,740 1024,680 T2048,620"/>
    <path d="M0,1020 Q512,1080 1024,1020 T2048,900"/>
  </g>
  <!-- Hexagon accents -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.07" fill="none">
    <polygon points="1024,580 1044,600 1044,640 1024,660 1004,640 1004,600"/>
    <polygon points="800,300 812,314 812,342 800,356 788,342 788,314" transform="scale(0.5) translate(1600,600)"/>
    <polygon points="1024,300 1036,314 1036,342 1024,356 1012,342 1012,314" transform="scale(0.4) translate(2560,750)"/>
  </g>
</svg>